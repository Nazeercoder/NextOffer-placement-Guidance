<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>All Users</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body>
    <nav class="navbar navbar-expand navbar-dark"><div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">NextOffer<span style="color:#edf3ff">.</span></a><div class="ms-auto d-flex gap-2"><a class="btn btn-outline-light" th:href="@{/dashboard}">Dashboard</a><a class="btn btn-danger" th:href="@{/logout}">Log out</a></div></div></nav>
    <main class="container page-wrap">
    <div class="hero-kicker">Your community</div><h1 class="page-heading">Registered users</h1><p class="page-subtitle">Manage the accounts on your platform.</p>
    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle">
      <tr>
        <th>ID</th>
        <th>Full Name</th>
        <th>Email</th>
        <th>Phone</th>
        <th>Action</th>
      </tr>

      <tr th:each="user : ${users}">
        <td th:text="${user.id}"></td>

        <td th:text="${user.fullName}"></td>

        <td th:text="${user.email}"></td>

        <td th:text="${user.phone}"></td>
        <td>
          <a
            th:href="@{/delete/{id}(id=${user.id})}"
            onclick="
              return confirm('Are you sure you want to delete this user?');
            "
            >Delete</a
          >
        </td>
      </tr>
    </table></div></div>
    </main>
  </body>
</html>
