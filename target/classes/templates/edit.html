<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit User</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body><main class="auth-shell"><div class="card auth-card"><div class="auth-header"><div class="hero-kicker">Account settings</div><h1 class="mt-2">Edit user</h1></div><div class="card-body">

    <form action="/update" method="post" th:object="${user}">
      <input type="hidden" th:field="*{id}" />

      <div class="mb-3"><label class="form-label">Full name</label><input class="form-control" type="text" th:field="*{fullName}" /></div>

      <div class="mb-3"><label class="form-label">Email</label><input class="form-control" type="email" th:field="*{email}" /></div>

      <div class="mb-3"><label class="form-label">Phone</label><input class="form-control" type="text" th:field="*{phone}" /></div>

      <div class="mb-3"><label class="form-label">Password</label><input class="form-control" type="password" th:field="*{password}" /></div>

      <div class="d-flex gap-2"><button class="btn btn-success" type="submit">Save changes</button><a class="btn btn-outline-light" th:href="@{/users}">Cancel</a></div>
    </form></div></div></main>
  </body>
</html>
