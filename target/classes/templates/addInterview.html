<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add Interview</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body class="bg-dark">
    <div
      class="container vh-100 d-flex justify-content-center align-items-center"
    >
      <div class="card shadow-lg" style="width: 500px">
        <div class="card-header bg-success text-white text-center">
          <h2>Add Interview</h2>
          <p class="mb-0">Track your interview schedule</p>
        </div>

        <div class="card-body">
          <form action="/save-interview" method="post" th:object="${interview}">
            <div class="mb-3">
              <label class="form-label">Company Name</label>
              <input
                type="text"
                class="form-control"
                th:field="*{companyName}"
                placeholder="Enter Company Name"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Role</label>
              <input
                type="text"
                class="form-control"
                th:field="*{role}"
                placeholder="Enter Role"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Interview Date</label>
              <input
                type="date"
                class="form-control"
                th:field="*{interviewDate}"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label">Status</label>
              <select class="form-select" th:field="*{status}">
                <option value="Scheduled">Scheduled</option>
                <option value="Completed">Completed</option>
                <option value="Rejected">Rejected</option>
              </select>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-success">
                Save Interview
              </button>

              <a href="/interviews" class="btn btn-secondary">
                Back to Interviews
              </a>

              <a href="/dashboard" class="btn btn-outline-dark"> Dashboard </a>
            </div>
          </form>
        </div>
      </div>
    </div>
  </body>
</html>
