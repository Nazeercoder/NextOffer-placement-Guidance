<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Manage users | NextOffer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css(v=4)}" />
</head>
<body>
  <nav class="navbar"><div class="container-fluid"><a class="navbar-brand" th:href="@{/admin/dashboard}">NextOffer<span style="color:#edf3ff">.</span> <small class="text-secondary">Admin</small></a><div class="ms-auto d-flex gap-2"><a class="btn btn-outline-light" th:href="@{/admin/dashboard}">Overview</a><a class="btn btn-danger" th:href="@{/logout}">Log out</a></div></div></nav>
  <main class="container page-wrap">
    <div class="hero-kicker">Account administration</div>
    <h1 class="page-heading">Manage users</h1>
    <p class="page-subtitle"><span th:text="${userCount}">0</span> registered accounts. Deleting an account also deletes its problems and interviews.</p>
    <div class="card"><div class="table-responsive"><table class="table table-hover align-middle">
      <thead><tr><th>ID</th><th>Name</th><th>Email</th><th>Phone</th><th>Action</th></tr></thead>
      <tbody>
        <tr th:each="account : ${users}"><td th:text="${account.id}"></td><td th:text="${account.fullName}"></td><td th:text="${account.email}"></td><td th:text="${account.phone}"></td><td><form th:action="@{/admin/users/{id}/delete(id=${account.id})}" method="post" onsubmit="return confirm('Delete this account and its progress?');"><button class="btn btn-danger btn-sm" type="submit">Delete account</button></form></td></tr>
        <tr th:if="${#lists.isEmpty(users)}"><td colspan="5" class="text-center text-muted py-4">No registered users yet.</td></tr>
      </tbody>
    </table></div></div>
  </main>
</body>
</html>
