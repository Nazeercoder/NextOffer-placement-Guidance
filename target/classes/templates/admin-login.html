<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Admin sign in | NextOffer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" th:href="@{/css/style.css(v=4)}" />
</head>
<body>
  <main class="auth-shell">
    <section class="card auth-card">
      <header class="auth-header">
        <a class="navbar-brand" th:href="@{/}">NextOffer<span style="color:#edf3ff">.</span></a>
        <h1 class="mt-4">Admin sign in</h1>
        <p>Access the platform overview.</p>
      </header>
      <div class="card-body">
        <div class="alert alert-danger" th:if="${param.error}">Invalid admin credentials or admin access is not configured.</div>
        <form th:action="@{/admin/login}" method="post">
          <div class="mb-3"><label class="form-label" for="email">Admin email</label><input id="email" class="form-control" type="email" name="email" required autocomplete="username" /></div>
          <div class="mb-4"><label class="form-label" for="password">Password</label><input id="password" class="form-control" type="password" name="password" required autocomplete="current-password" /></div>
          <button class="btn btn-success w-100" type="submit">Sign in as admin</button>
        </form>
        <div class="auth-foot"><a th:href="@{/login}">Regular user sign in</a></div>
      </div>
    </section>
  </main>
</body>
</html>
