<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Add DSA Problem</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body class="bg-dark text-light">
    <div class="container mt-5">
      <div class="row justify-content-center">
        <div class="col-md-6">
          <div class="card shadow-lg">
            <div class="card-header bg-primary text-white text-center">
              <h3>Add DSA Problem</h3>
            </div>

            <div class="card-body">
              <form action="/save-problem" method="post" th:object="${problem}">
                <div class="mb-3">
                  <label class="form-label"> Problem Name </label>

                  <input
                    type="text"
                    class="form-control"
                    th:field="*{problemName}"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Topic </label>

                  <input
                    type="text"
                    class="form-control"
                    th:field="*{topic}"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label"> Difficulty </label>

                  <select class="form-select" th:field="*{difficulty}">
                    <option value="Easy">Easy</option>

                    <option value="Medium">Medium</option>

                    <option value="Hard">Hard</option>
                  </select>
                </div>

                <div class="form-check mb-4">
                  <input
                    class="form-check-input"
                    type="checkbox"
                    th:field="*{solved}"
                  />

                  <label class="form-check-label"> Solved </label>
                </div>

                <div class="d-flex justify-content-between">
                  <a href="/problems" class="btn btn-secondary"> Back </a>

                  <button type="submit" class="btn btn-success">
                    Save Problem
                  </button>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
