<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DSA Problems</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body class="bg-dark text-light">
    <nav class="navbar navbar-expand navbar-dark"><div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">NextOffer<span style="color:#edf3ff">.</span></a><div class="ms-auto d-flex gap-2"><a class="btn btn-outline-light" th:href="@{/interviews}">Interviews</a><a class="btn btn-outline-light" th:href="@{/dashboard}">Dashboard</a><a class="btn btn-danger" th:href="@{/logout}">Log out</a></div></div></nav>
    <div class="container page-wrap">
      <div class="hero-kicker">Build your problem solving skills</div>
      <h1 class="page-heading">DSA problem tracker</h1>
      <p class="page-subtitle">Practice with intention. Keep your progress visible.</p>
      <h2 class="text-center mb-4">📘 DSA Problem Tracker</h2>

      <!-- Top Buttons -->
      <div class="d-flex justify-content-between mb-4">
        <a href="/dashboard" class="btn btn-secondary"> ← Dashboard </a>

        <a href="/add-problem" class="btn btn-success"> + Add New Problem </a>
      </div>

      <!-- Search -->
      <form action="/search-problems" method="get" class="row g-2 mb-3">
        <div class="col-md-9">
          <input
            type="text"
            name="keyword"
            class="form-control"
            placeholder="Search Problem"
          />
        </div>

        <div class="col-md-3">
          <button class="btn btn-primary w-100">Search</button>
        </div>
      </form>

      <!-- Filter -->
      <form action="/filter" method="get" class="row g-2 mb-4">
        <div class="col-md-9">
          <select name="difficulty" class="form-select">
            <option value="">Select Difficulty</option>

            <option value="Easy">Easy</option>

            <option value="Medium">Medium</option>

            <option value="Hard">Hard</option>
          </select>
        </div>

        <div class="col-md-3">
          <button class="btn btn-warning w-100">Filter</button>
        </div>
      </form>

      <a href="/problems" class="btn btn-info mb-4"> Show All Problems </a>

      <!-- Table -->
      <div class="card"><div class="table-responsive"><table class="table table-hover align-middle">
        <thead class="table-primary">
          <tr>
            <th>ID</th>

            <th>Problem Name</th>

            <th>Topic</th>

            <th>Difficulty</th>

            <th>Status</th>

            <th>Actions</th>
          </tr>
        </thead>

        <tbody>
          <tr th:each="problem : ${problems}">
            <td th:text="${problem.id}"></td>

            <td th:text="${problem.problemName}"></td>

            <td th:text="${problem.topic}"></td>

            <td>
              <span
                class="badge"
                th:classappend="${problem.difficulty=='Easy'} ? ' bg-success' :
                                    (${problem.difficulty=='Medium'} ? ' bg-warning text-dark' :
                                    ' bg-danger')"
                th:text="${problem.difficulty}"
              >
              </span>
            </td>

            <td>
              <span class="badge bg-success" th:if="${problem.solved}">
                Solved
              </span>

              <span class="badge bg-danger" th:unless="${problem.solved}">
                Unsolved
              </span>
            </td>

            <td>
              <a
                th:href="@{/edit-problem/{id}(id=${problem.id})}"
                class="btn btn-warning btn-sm"
              >
                Edit
              </a>

              <a
                th:href="@{/delete-problem/{id}(id=${problem.id})}"
                class="btn btn-danger btn-sm"
                onclick="
                  return confirm(
                    'Are you sure you want to delete this problem?',
                  );
                "
              >
                Delete
              </a>
            </td>
          </tr>
        </tbody>
      </table></div></div>
    </div>
  </body>
</html>
