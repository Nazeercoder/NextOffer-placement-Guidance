<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Edit interview | NextOffer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>
  <body>
    <nav class="navbar navbar-expand navbar-dark"><div class="container-fluid"><a class="navbar-brand" th:href="@{/dashboard}">NextOffer<span style="color:#edf3ff">.</span></a><div class="ms-auto d-flex gap-2"><a class="btn btn-outline-light" th:href="@{/interviews}">Interviews</a><a class="btn btn-outline-light" th:href="@{/dashboard}">Dashboard</a></div></div></nav>
    <main class="auth-shell">
      <div class="card auth-card">
        <div class="auth-header"><div class="hero-kicker">Keep your pipeline current</div><h1 class="mt-2">Edit interview</h1><p>Update the details for your next opportunity.</p></div>
        <div class="card-body">
          <form action="/update-interview" method="post" th:object="${interview}">
            <input type="hidden" th:field="*{id}" />
            <div class="mb-3"><label class="form-label">Company name</label><input type="text" class="form-control" th:field="*{companyName}" required /></div>
            <div class="mb-3"><label class="form-label">Role</label><input type="text" class="form-control" th:field="*{role}" required /></div>
            <div class="mb-3"><label class="form-label">Interview date</label><input type="date" class="form-control" th:field="*{interviewDate}" required /></div>
            <div class="mb-4"><label class="form-label">Status</label><select class="form-select" th:field="*{status}"><option value="Scheduled">Scheduled</option><option value="Completed">Completed</option><option value="Rejected">Rejected</option></select></div>
            <div class="d-flex flex-wrap gap-2"><button type="submit" class="btn btn-success">Save changes</button><a th:href="@{/interviews}" class="btn btn-outline-light">Cancel</a></div>
          </form>
        </div>
      </div>
    </main>
  </body>
</html>
