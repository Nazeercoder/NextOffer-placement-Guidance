<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Interview Tracker</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />

  </head>

    <body>
    <nav class="navbar navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <a class="navbar-brand text-success fw-bold" href="/dashboard">
          NextOffer
        </a>

        <div>
          <a class="btn btn-outline-light me-2" href="/dashboard">
            Dashboard
          </a>

          <a class="btn btn-outline-light me-2" href="/problems">
            DSA Problems
          </a>

          <a class="btn btn-outline-light me-2" href="/interviews">
            Interviews
          </a>

          <a class="btn btn-danger" href="/logout"> Logout </a>
        </div>
      </div>
    </nav>
    <div class="container page-wrap">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div><div class="hero-kicker">Keep your pipeline moving</div><h1 class="page-heading">Interview tracker</h1><p class="page-subtitle">Every conversation is a step forward.</p></div>

        <div>
          <a href="/dashboard" class="btn btn-outline-light me-2">
            Dashboard
          </a>

          <a href="/add-interview" class="btn btn-success"> + Add Interview </a>
        </div>
      </div>

      <div class="card">
        <div class="card-body">
          <table class="table table-hover align-middle">
            <thead>
              <tr>
                <th>Company</th>
                <th>Role</th>
                <th>Date</th>
                <th>Status</th>
                <th width="180">Actions</th>
              </tr>
            </thead>

            <tbody>
              <tr th:each="interview : ${interviews}">
                <td th:text="${interview.companyName}"></td>

                <td th:text="${interview.role}"></td>

                <td th:text="${interview.interviewDate}"></td>

                <td>
                  <span
                    class="badge"
                    th:text="${interview.status}"
                    th:classappend="
                                ${interview.status=='Scheduled'} ? ' status-scheduled' :
                                (${interview.status=='Completed'} ? ' status-completed' :
                                ' status-rejected')"
                  >
                  </span>
                </td>

                <td>
                  <a
                    th:href="@{/edit-interview/{id}(id=${interview.id})}"
                    class="btn btn-warning btn-sm"
                  >
                    Edit
                  </a>

                  <a
                    th:href="@{/delete-interview/{id}(id=${interview.id})}"
                    class="btn btn-danger btn-sm"
                    onclick="return confirm('Delete this interview?');"
                  >
                    Delete
                  </a>
                </td>
              </tr>

              <tr th:if="${#lists.isEmpty(interviews)}">
                <td colspan="5" class="text-center text-muted py-4">
                  No interviews added yet.
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </body>
</html>
