<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>NextOffer Login</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body>
    <main class="auth-shell">
      <div class="card auth-card">
        <div class="auth-header">
          <a class="navbar-brand" th:href="@{/}">NextOffer<span style="color:#edf3ff">.</span></a>
          <h1 class="mt-4">Welcome back</h1>
          <p>Sign in to pick up where you left off.</p>
        </div>

        <div class="card-body">
          <form th:action="@{/login}" method="post">
            <div class="mb-3">
              <label class="form-label">Email address</label>

              <input
                type="email"
                name="email"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label"> Password </label>

              <input
                type="password"
                name="password"
                class="form-control"
                placeholder="Enter Password"
                autocomplete="current-password"
                required
              />
            </div>

            <div class="d-grid">
              <button type="submit" class="btn btn-success">Log in</button>
            </div>
          </form>

          <hr />

          <div class="auth-foot">
            New to NextOffer? <a th:href="@{/register}">Create an account</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
