<!doctype html>
<html xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register | NextOffer</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" th:href="@{/css/style.css(v=3)}" />
  </head>

  <body>
    <main class="auth-shell">
      <div class="card auth-card">
        <div class="auth-header">
          <a class="navbar-brand" th:href="@{/}">NextOffer<span style="color:#edf3ff">.</span></a>
          <h1 class="mt-4">Create your account</h1>
          <p>Start building a more focused interview plan.</p>
        </div>

        <div class="card-body p-4">
          <form th:action="@{/register}" method="post" th:object="${user}">
            <div class="mb-3">
              <label class="form-label">Full Name</label>

              <input
                type="text"
                class="form-control"
                th:field="*{fullName}"
                placeholder="Enter your full name"
                autocomplete="name"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Email</label>

              <input
                type="email"
                class="form-control"
                th:field="*{email}"
                placeholder="Enter your email"
                autocomplete="email"
                required
              />
            </div>

            <div class="mb-3">
              <label class="form-label">Password</label>

              <input
                type="password"
                class="form-control"
                th:field="*{password}"
                placeholder="Create a password"
                autocomplete="new-password"
                required
              />
            </div>

            <div class="mb-4">
              <label class="form-label">Phone Number</label>

              <input
                type="text"
                class="form-control"
                th:field="*{phone}"
                placeholder="Enter your phone number"
                autocomplete="tel"
                required
              />
            </div>

            <div class="d-grid">
              <button class="btn btn-success btn-lg">Create account</button>
            </div>
          </form>

          <hr />

          <div class="auth-foot">
            Already have an account? <a th:href="@{/login}">Log in</a>
          </div>
        </div>
      </div>
    </main>
  </body>
</html>
